<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>初めての方のご予約｜松井整体院</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f5;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.7;
    }
    .box { width: 100%; max-width: 420px; padding: 24px 20px; box-sizing: border-box; }
    .center { text-align: center; }
    h1 { font-size: 20px; margin: 0 0 12px; text-align: center; }
    .lead { font-size: 15px; margin: 0 0 16px; }
    .label { font-size: 13px; color: #666; margin: 0 0 6px; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 84px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.6;
      resize: vertical;
    }
    .note { font-size: 13px; color: #666; margin: 8px 0 20px; }
    button {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
    }
    .primary { background: #06c755; color: #fff; }
    .primary:disabled { opacity: 0.6; }
    .secondary { background: transparent; color: #888; font-weight: normal; font-size: 14px; margin-top: 8px; }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      border: 4px solid #ddd;
      border-top-color: #06c755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #06c755; font-weight: bold; }
  </style>
</head>
<body>
  <!-- 読み込み中・移動中 -->
  <div class="box center" id="loading">
    <div class="spinner"></div>
    <p id="msg">読み込んでいます…</p>
    <p><a id="fallback" href="#" hidden>開かない場合はこちら</a></p>
  </div>

  <!-- 送信前の確認画面（LINEアプリ内で開いた時だけ表示） -->
  <div class="box" id="confirm" hidden>
    <h1>はじめての方へ</h1>
    <p class="lead">
      下のボタンを押すと、松井整体院のトークに次のメッセージが届きます。<br>
      このメッセージが届かないと、こちらからご連絡ができないため、送信をお願いしています。
    </p>
    <p class="label">送る内容（書き換えてもOKです）</p>
    <textarea id="text"></textarea>
    <p class="note">送信のあと、問診票（3分ほど）が開きます。</p>
    <button class="primary" id="send">送信して問診票へ進む</button>
    <button class="secondary" id="cancel">今はやめておく</button>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ===== ここだけ書き換えればOK =====
    const LIFF_ID = "2011868495-fvbw9BHw";
    const FORM_URL = "https://form.jotform.com/262519151972057";
    const MESSAGE = "はじめまして。体のことで相談したいです。これから問診票を書きます。";
    // ==================================

    const loading = document.getElementById("loading");
    const confirmBox = document.getElementById("confirm");
    const msg = document.getElementById("msg");
    const fallback = document.getElementById("fallback");
    const textArea = document.getElementById("text");
    const sendBtn = document.getElementById("send");
    const cancelBtn = document.getElementById("cancel");
    fallback.href = FORM_URL;
    textArea.value = MESSAGE;

    function goToForm() {
      confirmBox.hidden = true;
      loading.hidden = false;
      msg.textContent = "問診票を開いています…";
      fallback.hidden = false;
      location.replace(FORM_URL);
    }

    sendBtn.addEventListener("click", async () => {
      const text = textArea.value.trim() || MESSAGE;
      sendBtn.disabled = true;
      sendBtn.textContent = "送信しています…";
      try {
        await liff.sendMessages([{ type: "text", text }]);
      } catch (e) {
        // 送信に失敗しても問診票には進めるようにする
        console.error(e);
      }
      goToForm();
    });

    cancelBtn.addEventListener("click", () => {
      if (liff.isInClient()) {
        liff.closeWindow();
      } else {
        history.back();
      }
    });

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        // LINEアプリ内（公式アカウントとのトーク）で開いた時は、送信前に確認画面を出す
        if (liff.isInClient() && liff.getContext()?.type === "utou") {
          loading.hidden = true;
          confirmBox.hidden = false;
          return;
        }
      } catch (e) {
        console.error(e);
      }
      // LINEの外で開いた時などは、そのまま問診票へ
      goToForm();
    }

    main();
  </script>
</body>
</html>

<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">問診票を開いています…</p>
    <p><a id="fallback" href="#" hidden>開かない場合はこちら</a></p>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ===== ここだけ書き換えればOK =====
    const LIFF_ID = "2011868495-fvbw9BHw";
    const FORM_URL = "https://form.jotform.com/262519151972057";
    const MESSAGE = "初めての予約を希望します。問診票を記入します！";
    // ==================================

    const fallback = document.getElementById("fallback");
    fallback.href = FORM_URL;

    function goToForm() {
      fallback.hidden = false;
      location.replace(FORM_URL);
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        // LINEアプリ内で開いた時だけ、お客さん名義でメッセージを送る
        if (liff.isInClient() && liff.getContext()?.type === "utou") {
          await liff.sendMessages([{ type: "text", text: MESSAGE }]);
        }
      } catch (e) {
        // 送信に失敗しても問診票には進めるようにする
        console.error(e);
      }
      goToForm();
    }

    main();
  </script>
</body>
</html>
