<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>初めての方のご予約｜松井整体院</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f5;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      text-align: center;
    }
    .box { padding: 24px 16px; }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      border: 4px solid #ddd;
      border-top-color: #06c755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #06c755; font-weight: bold; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">問診票を開いています…</p>
    <p><a id="fallback" href="#" hidden>開かない場合はこちら</a></p>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ===== ここだけ書き換えればOK =====
    const LIFF_ID = "2011868495-fvbw9BHw";
    const FORM_URL = "https://form.jotform.com/262519151972057";
    const MESSAGE = "初めての予約を希望します。問診票を記入します！";
    // ==================================

    const fallback = document.getElementById("fallback");
    fallback.href = FORM_URL;

    function goToForm() {
      fallback.hidden = false;
      location.replace(FORM_URL);
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        // LINEアプリ内で開いた時だけ、お客さん名義でメッセージを送る
        if (liff.isInClient() && liff.getContext()?.type === "utou") {
          await liff.sendMessages([{ type: "text", text: MESSAGE }]);
        }
      } catch (e) {
        // 送信に失敗しても問診票には進めるようにする
        console.error(e);
      }
      goToForm();
    }

    main();
  </script>
</body>
</html>
